<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ورود با شماره موبایل</title>

<style>
body {
  font-family: Tahoma, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: #fff;
  padding: 25px;
  width: 320px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,.1);
}
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}
button {
  background: #0077ff;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover {
  background: #005fd1;
}
#codeBox {
  display: none;
}
</style>
</head>

<body>

<div class="box">
  <h3>ورود با شماره موبایل</h3>

  <input id="phone" placeholder="+989xxxxxxxxx">
  <div id="recaptcha-container"></div>
  <button onclick="sendCode()">ارسال کد</button>

  <div id="codeBox">
    <input id="code" placeholder="کد پیامک شده">
    <button onclick="verifyCode()">تایید کد</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

// 🔹 تنظیمات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDxUff3NrphFFpOyCyk06kBTRLswJ7VuLE",
  authDomain: "barsam-4677.firebaseapp.com",
  projectId: "barsam-4677",
  appId: "1:1071690062903:web:0e732a2c359b73c8dbb3b2"
};

// 🔹 اتصال
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔹 ساخت reCAPTCHA
window.recaptchaVerifier = new RecaptchaVerifier(
  'recaptcha-container',
  { size: 'normal' },
  auth
);

// 🔹 ارسال کد پیامکی
window.sendCode = function () {
  const phone = document.getElementById("phone").value;

  signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
    .then((confirmationResult) => {
      window.confirmationResult = confirmationResult;
      document.getElementById("codeBox").style.display = "block";
      alert("کد ارسال شد");
    })
    .catch((error) => {
      alert(error.message);
    });
};

// 🔹 تایید کد
window.verifyCode = function () {
  const code = document.getElementById("code").value;

  window.confirmationResult.confirm(code)
    .then(() => {
      alert("ورود موفق ✅");
      window.location.href = "index.html";
    })
    .catch((error) => {
      alert("کد اشتباه است");
    });
};
</script>

</body>
</html>
