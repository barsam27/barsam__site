<!DOCTYPE html>
<html lang="fa">
<head>

      text-align: center;

      background-color: #2b2b2b;
      color: #ffffff;
      padding: 30px;
      font-size: 22px;
      line-height: 1.8;
    }

    p {
      margin-bottom: 25px;
    }

    /* دکمه واتساپ */
    .whatsapp-btn {
      display: inline-block;
      padding: 14px 26px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 24px;
      margin: 20px 0;
      transition: 0.3s;
    }

    .whatsapp-btn:hover {
      background-color: #1ebe5d;
      transform: scale(1.03);
    }

    /* موبایل */
    @media (max-width: 768px) {
      body {
        font-size: 18px;
        padding: 20px;
      }

      .whatsapp-btn {
        font-size: 20px;
        padding: 12px 22px;
      }
    }
  </style>
</head>

<body>

    برای خرید و دریافت فایل، روی دکمه واتساپ زیر کلیک کنید و پیام بدهید:

    📞 پیام در واتساپ
  </a>

  <p>
    بعد از هماهنگی و پرداخت، فایل پایتون برای شما ارسال می‌شود.
  </p>

</body>
</html>
